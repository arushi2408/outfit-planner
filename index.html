
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCheck | Outfit Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8f7;
  color: #382b32;
}

header {
  text-align: center;
  padding: 35px 16px;
  background: #f4dce5;
}

header h1 {
  font-size: 38px;
  margin: 0 0 10px;
}

header p {
  margin: 0;
  color: #765b68;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 16px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin: 20px 0 30px;
}

select, input, button {
  padding: 12px;
  border: 1px solid #e4c4d1;
  border-radius: 10px;
  background: white;
  font-size: 15px;
}

input {
  min-width: 200px;
}

button {
  cursor: pointer;
  background: #75465d;
  color: white;
  border: none;
}

button:hover {
  background: #593347;
}

#status {
  text-align: center;
  margin: 20px 0;
  color: #765b68;
}

#outfits {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 22px;
}

.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 4px 15px #563b4812;
}

.card img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  background: #f3e9ed;
}

.card-content {
  padding: 15px;
}

.card h3 {
  margin: 0 0 10px;
}

.tag {
  display: inline-block;
  padding: 5px 9px;
  margin: 3px 3px 0 0;
  background: #f8e8ef;
  border-radius: 20px;
  font-size: 12px;
}

.empty {
  text-align: center;
  padding: 30px;
  grid-column: 1 / -1;
}

footer {
  text-align: center;
  padding: 25px;
  color: #765b68;
}
</style>
</head>

<body>

<header>
  <h1>FitCheck ♡</h1>
  <p>Your personal outfit planner</p>
</header>

<main>
  <h2>Find your next outfit</h2>
  <p>Explore clothing and find something for your vibe.</p>

  <div class="filters">
    <input
      id="search"
      type="search"
      placeholder="Search outfits..."
      aria-label="Search outfits"
    >

    <select id="category" aria-label="Filter by category">
      <option value="all">All categories</option>
      <option value="top">Tops</option>
      <option value="jeans">Jeans</option>
      <option value="dress">Dresses</option>
      <option value="pants">Pants</option>
      <option value="skirt">Skirts</option>
      <option value="shoes">Shoes</option>
    </select>

    <select id="occasion" aria-label="Filter by occasion">
      <option value="all">All occasions</option>
      <option value="casual">Casual</option>
      <option value="college">College</option>
      <option value="party">Party</option>
      <option value="formal">Formal</option>
    </select>

    <button id="reset">Reset filters</button>
  </div>

  <p id="status" role="status">Loading clothing dataset...</p>
  <section id="outfits" aria-label="Clothing recommendations"></section>
</main>

<footer>
  FitCheck — Find your style, your way ♡
</footer>

<script>
const grid = document.getElementById("outfits");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("search");
const categorySelect = document.getElementById("category");
const occasionSelect = document.getElementById("occasion");

let outfits = [];

function makeText(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;

  if (className) {
    element.className = className;
  }

  return element;
}

function renderOutfits() {
  const query = searchInput.value.trim().toLowerCase();
  const category = categorySelect.value;
  const occasion = occasionSelect.value;

  const filtered = outfits.filter(item => {
    const searchableText = [
      item.name,
      item.category,
      item.occasion
    ].filter(Boolean).join(" ").toLowerCase();

    return searchableText.includes(query) &&
      (category === "all" ||
       String(item.category || "").toLowerCase() === category) &&
      (occasion === "all" ||
       String(item.occasion || "").toLowerCase() === occasion);
  });

  grid.replaceChildren();

  statusText.textContent =
    `${filtered.length} outfit item(s) found`;

  if (filtered.length === 0) {
    grid.appendChild(
      makeText("p", "No matching outfits. Try another filter.", "empty")
    );
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.alt = item.name || "Clothing item";
    img.loading = "lazy";
    img.src = item.image || "";

    img.addEventListener("error", () => {
      img.removeAttribute("src");
      img.alt = "Image unavailable for " + (item.name || "this item");
    }, { once: true });

    const content = document.createElement("div");
    content.className = "card-content";

    content.appendChild(
      makeText("h3", item.name || "Clothing item")
    );

    if (item.category) {
      content.appendChild(
        makeText("span", item.category, "tag")
      );
    }

    if (item.occasion) {
      content.appendChild(
        makeText("span", item.occasion, "tag")
      );
    }

    card.append(img, content);
    grid.appendChild(card);
  });
}

async function loadDataset() {
  try {
    const response = await fetch("./outfits.json");

    if (!response.ok) {
      throw new Error("Could not find outfits.json");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("The JSON file must contain a list of outfits");
    }

    outfits = data.filter(item =>
      item && typeof item === "object"
    );

    renderOutfits();
  } catch (error) {
    statusText.textContent =
      "Dataset could not load. Check that outfits.json is in the same folder as index.html and contains valid JSON.";

    grid.replaceChildren();
    console.error("Dataset loading error:", error);
  }
}

searchInput.addEventListener("input", renderOutfits);
categorySelect.addEventListener("change", renderOutfits);
occasionSelect.addEventListener("change", renderOutfits);

document.getElementById("reset").addEventListener("click", () => {
  searchInput.value = "";
  categorySelect.value = "all";
  occasionSelect.value = "all";
  renderOutfits();
});

loadDataset();
</script>

</body>
</html>
